<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letters — Dear, in Stereo</title>
<meta name="description" content="Some things are easier to say through a song.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f3ecdd">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Young+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header id="site-header"></header>
<main id="main" class="wrap page"><div class="page__head"><div><h1>Letters</h1><p>Everything you have written, drafted or archived.</p></div><div class=cluster><a class="btn btn--accent" href="/letters/edit">Write a letter</a></div></div>
<form id="filters" class="filters" role="search" aria-label="Filter letters">
<div class="field field--wide"><label for="q">Search</label><input id="q" name="q" type="search" placeholder="Title, song, artist, recipient or message" maxlength="100"></div>
<div class="field"><label for="status">Status</label><select id="status" name="status"><option value="active">Drafts and published</option><option value="draft">Drafts</option><option value="published">Published</option><option value="archived">Archived</option><option value="all">Everything</option></select></div>
<div class="field"><label for="visibility">Sharing</label><select id="visibility" name="visibility"><option value="">Any</option><option value="link">Has a share link</option><option value="private">Private</option></select></div>
<div class="field"><label for="reason">Reason</label><select id="reason" name="reason"><option value="">Any</option></select></div>
<div class="field"><label for="sort">Sort by</label><select id="sort" name="sort"><option value="updated">Recently updated</option><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="title">Title</option></select></div>
</form>
<p id="result-count" class="small muted" aria-live="polite"></p>
<div id="list"></div><div id="pager" class="pager"></div></main>
<footer id="site-footer"></footer>
<script type="module" src="/js/pages/letters-list.js"></script>
</body>
</html>
